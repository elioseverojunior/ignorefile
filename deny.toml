[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "MIT-0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# The allow list is a POLICY statement -- these licenses are pre-approved for
# this project -- not a description of the current tree. Without this, every
# approved-but-currently-unused license reports `license-not-encountered`, so
# the list could only stay quiet by being pruned down to whatever today's
# dependencies happen to use (and re-edited whenever one is added).
unused-allowed-license = "allow"

[licenses.private]
ignore = false

[bans]
external-default-features = "allow"
highlight = "all"
multiple-versions = "warn"
wildcards = "allow"
workspace-default-features = "allow"

[sources]
allow-git = []
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"
unknown-registry = "deny"
