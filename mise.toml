# mise configuration ~ https://mise.jdx.dev
#
# mise provisions the Rust toolchain, but the VERSION stays defined once in
# `rust-toolchain.toml` (the canonical file rustup, cargo and IDEs also read).
# Enabling the idiomatic-version-file setting below lets mise install Rust from
# that file, so there is a single source of truth and no drift. Node works the
# same way: its version lives in package.json's `devEngines.runtime`. Auxiliary
# tools (git-cliff, hk, etc.) are pinned explicitly in [tools] below.

[settings]
color = true
experimental = true
idiomatic_version_file = true
idiomatic_version_file_enable_tools = []
legacy_version_file = false
lockfile = true
not_found_auto_install = true
python.uv_venv_auto = "create|source"
quiet = true
### Debug
#verbose = true
#log_level = "debug"

[env]
ARCH = "{{exec(command='uname -m')}}"
GITHUB_TOKEN = "{{env.GITHUB_TOKEN | default(value='')}}"
PROJECT_NAME = "{{exec(command='basename $(git config --get remote.origin.url) .git || basename $PWD')}}"
RUST_COVERAGE_THRESHOLD = "100"
_.file = ".env"

[tools]
# rust is provisioned from rust-toolchain.toml via [settings] above — no version
# is repeated here, keeping rust-toolchain.toml the single source of truth.
actionlint = { version = "latest" }
"aqua:hk" = { version = "latest", os = [
  "linux",
  "windows",
  "macos/arm64",
], arch = [
  "arm64",
  "x64",
], locked = false }
"cargo:cargo-audit" = { version = "latest" }
"cargo:cargo-crap" = { version = "latest" }
"cargo:cargo-criterion" = { version = "latest" }
"cargo:cargo-deny" = { version = "latest" }
"cargo:cargo-edit" = { version = "latest" }
"cargo:cargo-fuzz" = { version = "latest" }
# Required by `mise run coverage:llvm`, which `mise run coverage` selects by default.
# It was pinned nowhere, so that task failed with "no such command: llvm-cov".
"cargo:cargo-llvm-cov" = { version = "latest" }
"cargo:cargo-machete" = { version = "latest" }
"cargo:cargo-mutants" = { version = "latest" }
"cargo:cargo-nextest" = { version = "latest" }
"cargo:cargo-pgo" = { version = "latest" }
"cargo:cargo-semver-checks" = { version = "latest" }
"cargo:cargo-sort" = { version = "latest" }
"cargo:cargo-tarpaulin" = { version = "latest" }
"cargo:cargo-wizard" = { version = "latest" }
"cargo:committed" = { version = "latest" }
"cargo:flamegraph" = { version = "latest" }
"cargo:rumdl" = { version = "latest" }
"cargo:taplo-cli" = { version = "latest" }
"cargo:yamllint-rs" = { version = "latest" }
git-cliff = { version = "latest" }
gitleaks = { version = "latest" }
"pipx:codecov-cli" = { version = "latest" }
scorecard = { version = "latest" }
taplo = { version = "latest" }

# comply is deliberately NOT a [tools] entry. mise auto-installs every entry here
# before ANY task runs, so a comply that fails to build takes the whole task
# runner with it -- `mise run yamllint` died on a cargo error about a licence
# tool. `version = "ref:main"` is also not valid mise syntax ("Invalid cargo git
# version"); the cargo backend wants `rev:`, and even then it rebuilds from
# source rather than skipping an installed copy.
#
# `[tasks.comply]` provisions it instead: it skips when `comply` is already on
# PATH and otherwise installs from main. That keeps a comply problem confined to
# comply's own tasks.

[hooks]
enter = { task = "setup" }
postinstall = '''
echo "Installed: $MISE_INSTALLED_TOOLS"
'''

[deps.cargo]
auto = true

[deps.gh]
auto = true

[tasks."actions:pins"]
alias = ["uap"]
description = "Update all GitHub Actions SHA pins to latest releases. Automatically sets GITHUB_TOKEN via gh auth."
run = '''
#!/usr/bin/env bash
set -Eeuo pipefail
export GITHUB_TOKEN=$(gh auth token)
python3 scripts/update-actions-pins.py --write --apply-major
unset GITHUB_TOKEN
'''

[tasks."act:setup"]
alias = []
description = "Create the .act/ scratch files .actrc points at (idempotent)"
hide = true
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# `if` blocks, not `[ ! -f x ] && cmd`: as the final statement that idiom makes
# the whole task exit 1 once the file exists, which broke every run after the
# first -- and `act` depends on this task, so `mise run act` never started.
mkdir -p .act/

if [ ! -f ".act/README.md" ]; then
  cat <<-'README' > ".act/README.md"
# [Nektos/ACT](https://nektosact.com)

This folder must not have any file commited except this README.md
README
fi

# .actrc passes --secret-file/--var-file/--eventpath unconditionally, so act
# aborts if any of these is absent. .secrets holds a live token at run time and
# is created 0600 here so it is never briefly world-readable.
for f in .act/.vars .act/.env; do
  [ -f "$f" ] || touch "$f"
done
if [ ! -f ".act/.secrets" ]; then
  touch .act/.secrets
  chmod 600 .act/.secrets
fi
# A populated repository stanza, not `{}`: third-party actions read
# `payload.repository.owner` and die with "Cannot read properties of undefined"
# on an empty event, which is what made the Secrets Scan job unrunnable locally.
# Owner/name come from the git remote so the payload matches the real repo.
if [ ! -f ".act/event.json" ]; then
    # Parameter expansion, not sed: BSD sed has no lazy quantifier, so an ERE
    # that works on GNU fails on macOS with "repetition-operator operand invalid".
    slug=$(git remote get-url origin 2>/dev/null || true)
    slug=${slug%.git}
    slug=${slug#*://}
    slug=${slug#*@}
    slug=${slug#*:}
    name=${slug##*/}
    owner=${slug%/*}
    owner=${owner##*/}
    : "${owner:=local}"
    : "${name:=$(basename "$PWD")}"
    sha=$(git rev-parse HEAD 2>/dev/null || echo 0000000000000000000000000000000000000000)
    branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo main)
    # `commits` and `ref` matter as much as `repository`: a push-event consumer
    # reads `eventJSON.commits.length` and dies on an empty object.
    printf '%s\n' \
      '{' \
      "  \"ref\": \"refs/heads/$branch\"," \
      "  \"before\": \"$sha\"," \
      "  \"after\": \"$sha\"," \
      "  \"commits\": [ { \"id\": \"$sha\" } ]," \
      '  "repository": {' \
      "    \"name\": \"$name\"," \
      "    \"full_name\": \"$owner/$name\"," \
      "    \"default_branch\": \"$branch\"," \
      '    "private": false,' \
      "    \"owner\": { \"login\": \"$owner\", \"name\": \"$owner\" }" \
      '  }' \
      '}' > .act/event.json
fi
'''

[tasks.act]
alias = []
depends = ["act:setup"]
description = "Run a workflow locally with Nektos/act, e.g. `mise run act -w ci -j formatting`"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Was `-W .github/workflows/tests/<name>.yml`, a path copied from another repo
# that does not exist here, so every invocation failed on a missing file.
workflow=".github/workflows/${usage_workflow?}.yml"
if [ ! -f "$workflow" ]; then
  echo "No such workflow: $workflow" >&2
  echo "Available:" >&2
  basename -s .yml .github/workflows/*.yml | sed 's/^/  /' >&2
  exit 1
fi

gh auth token > /dev/null 2>&1 || { echo "gh is not authenticated; run: gh auth login" >&2; exit 1; }

# The token is passed with `-s`, never written to .act/.secrets. Keeping it on
# disk was safe from *git* (.gitignore) but not from anything else: gitleaks does
# not read .gitignore, so `gitleaks dir` flagged it as a real leak, and act
# copies the whole working tree into the container. .actrc still requires the
# file to exist, so act:setup leaves it empty.
# .actrc hardcodes --container-daemon-socket=/var/run/docker.sock, which exists
# only for some runtimes -- under Docker Desktop or colima on macOS the socket
# lives elsewhere, and act then fails with "no such file or directory" before it
# runs a single step. Resolve the endpoint the docker CLI is actually using, and
# fall back to the first context that answers.
socket="${DOCKER_HOST:-}"
if [ -z "$socket" ]; then
    socket=$(docker context inspect 2>/dev/null | jq -r '.[0].Endpoints.docker.Host // empty')
fi
if [ -z "$socket" ] || ! docker --host "$socket" info >/dev/null 2>&1; then
    for candidate in $(docker context ls --format json 2>/dev/null | jq -r '.DockerEndpoint // empty'); do
        if docker --host "$candidate" info >/dev/null 2>&1; then
            socket="$candidate"
            break
        fi
    done
fi
if [ -z "$socket" ] || ! docker --host "$socket" info >/dev/null 2>&1; then
    echo "No reachable Docker daemon. Start Docker Desktop or run: colima start" >&2
    exit 1
fi
echo "Using Docker daemon at $socket"

# .actrc passes --detect-event, which picks `pull_request` for a workflow that
# declares both triggers. Locally there is no PR, so actions that query the PR
# API call `/pulls//commits` with an empty number and 404. A working tree is a
# push, so select that explicitly whenever the workflow accepts one.
event=()
if grep -qE '^[[:space:]]*push:' "$workflow"; then
    event=(push)
fi

args=("${event[@]}" -W "$workflow" -s "GITHUB_TOKEN=$(gh auth token)")
# `-` disables bind-mounting the socket into the job container. act mounts it by
# default so a workflow can talk to Docker, which none of these do -- and under
# colima the socket lives inside a VM, so the mount fails outright with
# "operation not supported". DOCKER_HOST below is what act itself connects on.
args+=(--container-daemon-socket -)
[ -n "${usage_job:-}" ] && args+=(-j "$usage_job")
DOCKER_HOST="$socket" act "${args[@]}"
'''
usage = '''
flag "-w --workflow <workflow>" help="Workflow basename under .github/workflows" default="ci" env="ACT_WORKFLOW"
flag "-j --job <job>" help="Single job id to run; omit to run the whole workflow" env="ACT_JOB"
'''

[tasks.all]
alias = []
description = "Run all local development tasks"
hide = true
run = '''
mise lock
mise run fmt
mise run coverage:tarpaulin
mise run build:install
mise run git:amend:push:force
'''

[tasks."gitignore:check"]
alias = ["gitignore", "ignore:check"]
description = "Git Ignore Check"
hide = true
run = '''
git check-ignore -v .act/.secrets .act/.vars .act/.env .act/event.json .act/README.md
'''

[tasks."git:amend"]
alias = []
description = "Git Commit Saged with Amend"
hide = true
run = '''
git add -A .
git commit -S --amend --no-edit --reset-author
'''

[tasks."git:amend:push:force"]
alias = []
description = "Git Commit Saged with Amend"
hide = true
run = '''
mise run git:amend
git push --force-with-lease || git push --force
date
'''

[tasks."hk:chek"]
alias = ["hook:check"]
description = "HK Hook Check"
hide = true
run = '''
hk check --all
'''

[tasks."hk:fix"]
alias = ["hook:fix"]
description = "HK Hook Fix"
hide = true
run = '''
hk fix --stage --all
'''

# === Tool Installation ===
[tasks.setup]
alias = ["install", "dev", "dev:setup", "dev:up"]
description = "Install tools, sourcing from Homebrew when it matches the pin"
run = '''
set -eo pipefail

# Homebrew is preferred on macOS when present, but ONLY for a tool whose
# installed version already equals the pin in [tools] above. None of these ship
# a versioned formula (there is no swiftlint@0.65.0), so brew tracks whatever is
# current — honouring it blindly would silently break the pinning this file
# exists to guarantee. On any mismatch the pin wins and mise installs the tool.
#
# Formula names only; versions are read back from [tools] so mise.toml stays the
# single source of truth.
BREW_TOOLS="git-cliff gitleaks gh jq rustup scorecard uv yq"

root="$(git rev-parse --show-toplevel)"
local_cfg="$root/mise.local.toml"

# An empty MISE_DISABLE_TOOLS overrides whatever mise.local.toml sets, so the
# lockfile is always written from the FULL toolset. A disabled tool is omitted
# from mise.lock entirely, and a brew machine committing such a lockfile would
# leave non-brew machines unresolvable. This is why locking no longer needs to
# delete the local config first.
MISE_DISABLE_TOOLS= mise lock

have_brew=no
if [ "$(uname -s)" = "Darwin" ] && command -v brew >/dev/null 2>&1; then
  have_brew=yes
fi

# One batched call: six separate `brew list` invocations cost roughly 5x more.
brew_versions() {
  [ "$have_brew" = yes ] || return 0
  brew list --versions $BREW_TOOLS 2>/dev/null | sort || true
}

# `mise ls --current` merges the global config, so intersecting with BREW_TOOLS
# below keeps this to the project's own tools.
pins="$(MISE_DISABLE_TOOLS= mise ls --current --json | jq -r 'to_entries[] | "\(.key) \(.value[0].requested_version)"' | sort)"

# Fingerprint every input that decides this file's content. Hashing mise.lock
# alone is NOT sufficient: Homebrew moving swiftlint 0.65.0 -> 0.66.0 must force
# a rewrite, and nothing about that touches the lockfile.
fingerprint() {
  printf '%s\n' \
    "v1" "$(uname -s)" "$(uname -m)" "$have_brew" "$pins" "$(brew_versions)" \
    "$(shasum -a 256 "$root/mise.lock" 2>/dev/null | cut -d" " -f1)" \
    | shasum -a 256 | cut -d" " -f1
}

# `mise install` can settle new entries into mise.lock — a first-time install of
# a version, or a tool added since the last lock — which leaves the fingerprint
# just written already stale and costs one redundant rebuild on the next run.
# Re-stamping afterwards makes the cache converge in a single run.
refresh_fp() {
  [ -f "$local_cfg" ] || return 0
  local now tmp
  now="$(fingerprint)"
  if grep -qF "# fingerprint: $now" "$local_cfg"; then
    return 0
  fi
  tmp="$(mktemp)"
  awk -v fp="$now" '/^# fingerprint: /{ print "# fingerprint: " fp; next } { print }' "$local_cfg" > "$tmp"
  mv "$tmp" "$local_cfg"
}

fp="$(fingerprint)"
if [ -f "$local_cfg" ] && grep -qF "# fingerprint: $fp" "$local_cfg"; then
  echo "mise.local.toml up to date ($(printf '%s' "$fp" | cut -c1-12))"
  mise install
  mise deps
  refresh_fp
  exit 0
fi

lookup() { printf '%s\n' "$2" | awk -v t="$1" '$1 == t { print $2 }'; }

brewed=""
installed_any=no
if [ "$have_brew" = yes ]; then
  state="$(brew_versions)"
  missing=""

  for f in $BREW_TOOLS; do
    pin="$(lookup "$f" "$pins")"
    [ -n "$pin" ] || continue
    inst="$(lookup "$f" "$state")"

    if [ -z "$inst" ]; then
      missing="$missing $f"
    elif [ "$pin" = "latest" ] || [ "$pin" = "$inst" ]; then
      brewed="$brewed $f"
      echo "brew $f $inst"
    else
      echo "mise $f $pin (Homebrew has $inst)"
    fi
  done

  # Only tools that are not installed yet need the slow formula API, and they
  # are queried in a single batched call.
  if [ -n "$missing" ]; then
    stables="$(brew info --json=v2 $missing 2>/dev/null | jq -r '.formulae[] | "\(.name) \(.versions.stable)"' || true)"
    for f in $missing; do
      pin="$(lookup "$f" "$pins")"
      stable="$(lookup "$f" "$stables")"
      if [ -n "$stable" ] && { [ "$pin" = "latest" ] || [ "$pin" = "$stable" ]; }; then
        brew install "$f"
        brewed="$brewed $f"
        installed_any=yes
        echo "brew $f $stable (installed)"
      else
        echo "mise $f $pin${stable:+ (Homebrew has $stable)}"
      fi
    done
  fi
fi

# Installing changed what brew reports, so the fingerprint must be recomputed or
# the next run would see a mismatch and redo all of this for nothing.
[ "$installed_any" = yes ] && fp="$(fingerprint)"

# disable_tools makes mise step aside so its shims stop shadowing Homebrew's
# bin. Machine-specific, hence mise.local.toml rather than mise.toml.
{
  echo "# Generated by \`mise run install\` - machine-specific, not committed."
  echo "# fingerprint: $fp"
  if [ -n "$brewed" ]; then
    echo "# Tools Homebrew satisfies at the pinned version; mise handles the rest."
    echo "[settings]"
    printf 'disable_tools = ['
    sep=""
    for f in $brewed; do
      printf '%s"%s"' "$sep" "$f"
      sep=", "
    done
    printf ']\n'
  fi
  # hk ships a darwin/arm64 build but no darwin/amd64 one, and mise has no way
  # to gate a tool on architecture (see the [tools] comment). Adding it here
  # keeps Apple Silicon covered without breaking Intel Macs.
  if [ "$(uname -s)" = "Darwin" ] && [ "$(uname -m)" = "arm64" ]; then
    echo '[tools]'
    echo '"aqua:hk" = { version = "latest", locked = false }'
  fi
} > "$local_cfg"

mise install
mise deps
refresh_fp
'''
shell = "bash -c"

[tasks."git:hooks:install"]
alias = []
description = "Install the git hooks managed by hk (global install for Git 2.54+)"
run = "hk install"

[tasks."git:hooks:install:global"]
alias = []
description = "Install the git hooks managed by hk (global install for Git 2.54+)"
run = "mise run git:hooks:install --global"

[tasks."git:hooks:install:local"]
alias = []
description = "Install the git hooks managed by hk (global install for Git 2.54+)"
run = "mise run git:hooks:install --force-local"

# Emits the GitVersion stamp the router serves from GET /version. Hidden because
# it is plumbing: the compose tasks source it, nobody runs it directly. Failure is
# not fatal — an unstamped deployment answers "unknown", which beats refusing to
# start over a version string.
[tasks."version:json"]
alias = []
description = "Print the GitVersion JSON for the working tree, or an empty object"
hide = true
run = '''
#!/usr/bin/env bash
set -eo pipefail
gitversion /output json | jq -Sr '. + {MajorMinor: "\(.Major).\(.Minor)"}' 2>/dev/null || echo '{}'
'''

[tasks.doc]
alias = ["d"]
description = "Build the API docs (private items included, no deps) to catch broken intra-doc links"
run = "cargo doc --all-features --no-deps --document-private-items"

[tasks."cargo:lock:check"]
alias = []
description = "Fail if Cargo.lock is out of date relative to Cargo.toml (run `cargo update` to refresh)"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# A dry-run that reports "Locking <n>" for n>=1 means the lockfile would change,
# i.e. it is stale. (Avoids `--locked`, which conflicts with `update`.)
if cargo update --workspace --dry-run 2>&1 | grep -q "Locking [1-9]"; then
    echo "Cargo.lock is out of date — run 'cargo update'." >&2
    exit 1
fi
'''
shell = "bash -c"

[tasks.yamllint]
alias = ["yl"]
description = "Lint YAML with yamllint-rs (Rust); pass paths (e.g. hk {staged_files}) or default to the whole repo"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

eval "paths=(${usage_paths:-.})"
yamllint-rs "${paths[@]}"
'''
shell = "bash -c"
usage = 'arg "[paths]" var=#true help="Paths to lint; defaults to the whole repo when omitted"'

[tasks."yamllint:fix"]
alias = ["ylf"]
description = "Auto-fix fixable YAML issues with yamllint-rs (Rust)"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

eval "paths=(${usage_paths:-.})"
yamllint-rs --fix "${paths[@]}"
'''
shell = "bash -c"
usage = 'arg "[paths]" var=#true help="Paths to fix; defaults to the whole repo when omitted"'

[tasks.actionlint]
alias = ["al"]
description = "Lint GitHub Actions workflows with actionlint (config in .github/actionlint.yaml); pass paths (e.g. hk {staged_files}) or default to all workflows"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# actionlint auto-discovers .github/actionlint.yaml. With no paths it lints
# every workflow under .github/workflows; forward staged paths when given.
# Variadic args arrive shell-escaped — eval into an array so paths survive.
eval "paths=(${usage_paths:-})"
actionlint "${paths[@]}"
'''
shell = "bash -c"
usage = 'arg "[paths]" var=#true help="workflow files to lint; defaults to every workflow under .github/workflows when omitted"'

[tasks.markdownlint]
alias = ["md"]
description = "Lint Markdown with rumdl using config in .rumdl.toml"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

eval "paths=(${usage_paths:-})"
rumdl check "${paths[@]}"
'''
shell = "bash -c"
usage = 'arg "[paths]" var=#true help="paths/globs to lint; uses the config globs when omitted"'

[tasks."markdownlint:fix"]
alias = ["mdf"]
description = "Auto-fix Markdown issues (blank lines around headings/lists, etc.) with rumdl --fix"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

eval "paths=(${usage_paths:-})"
rumdl fmt "${paths[@]}"
'''
shell = "bash -c"
usage = 'arg "[paths]" var=#true help="paths/globs to fix; uses the config globs when omitted"'

[tasks."cargo:sort"]
alias = ["sort"]
description = "Sort [dependencies] tables in every Cargo.toml alphabetically with cargo-sort (writes). Run BEFORE taplo so taplo gets the final formatting pass"
run = "cargo sort --config tomlfmt.toml --grouped --workspace"

[tasks."cargo:sort:check"]
alias = ["sortc"]
description = "Check Cargo.toml dependency ordering without writing (the CI/pre-commit gate); fails if any [dependencies] table is unsorted"
run = "cargo sort --config tomlfmt.toml --grouped --workspace --check"

[tasks."taplo:fmt"]
alias = ["tf"]
description = "Format all TOML with taplo (writes; config in taplo.toml). The formatter of record for every .toml; pairs with cargo-sort, which owns Cargo.toml dependency ordering"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# taplo logs its config discovery and full file list to stderr at INFO, which hk
# surfaces as if the step had complained. Errors and the exit code are unaffected.
export RUST_LOG="${RUST_LOG:-error}"

# taplo auto-discovers taplo.toml. With no paths it formats every .toml in the
# repo (honouring taplo.toml's exclude); forward staged paths when given.
eval "paths=(${usage_paths:-})"
taplo fmt "${paths[@]}"
'''
shell = "bash -c"
usage = 'arg "[paths]" var=#true help="paths/globs to format; defaults to every .toml (per taplo.toml) when omitted"'

[tasks."taplo:check"]
alias = ["tfc"]
description = "Check TOML formatting without writing (the CI/pre-commit gate); prints a diff of any non-conforming file. Config in taplo.toml"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# See [tasks."taplo:fmt"]: quiet taplo's INFO tracing so only real diagnostics show.
export RUST_LOG="${RUST_LOG:-error}"

eval "paths=(${usage_paths:-})"
taplo fmt --check --diff "${paths[@]}"
'''
shell = "bash -c"
usage = 'arg "[paths]" var=#true help="paths/globs to check; defaults to every .toml when omitted"'

[tasks."comply:format:check"]
alias = []
description = "Fail if any SPDX header is not in comply's canonical form. Read-only counterpart to `mise run comply format`; `mise run comply` only checks a header EXISTS, not its shape, so without this the canonical form silently rots"
run = "mise run comply format --path . --check"

[tasks.comply]
alias = []
description = "Check REUSE/SPDX license compliance with comply (defaults to `lint`); pass a subcommand, e.g. `mise run comply annotate --license MIT --holder \"Name <email>\"`"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Variadic args arrive as a shell-escaped string; eval into an array so flags
# survive intact. Fall back to `lint` (the CI gate) when nothing is passed.
eval "args=(${usage_args:-lint})"

# Provision on demand rather than via [tools]. mise auto-installs EVERY [tools]
# entry before ANY task, so while comply was pinned there a build failure took
# down the whole task runner -- `mise run yamllint` died on a cargo error that
# had nothing to do with YAML. Installing here means only comply's own tasks can
# be blocked by comply.
#
# Skipped entirely when the binary is already on PATH: this is a from-source
# build of several minutes, and re-running it per invocation is what made the
# gate feel broken.
if ! command -v comply >/dev/null 2>&1; then
    echo "comply not found; installing from main..." >&2
    cargo install --locked --git https://github.com/elioseverojunior/comply --branch main
fi

comply "${args[@]}"
'''
shell = "bash -c"
usage = 'arg "[args]" var=#true help="comply subcommand + flags; defaults to `lint` when omitted"'

[tasks."comply:fix"]
alias = []
description = "Add/refresh SPDX headers on source files with `comply annotate` (the WRITE counterpart to the lint-only `comply` task). Requires explicit paths — it never blanket-annotates, since most files are covered aggregately by REUSE.toml's `**` rule"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# `comply lint` only CHECKS; this is the writer. Paths are required on purpose:
# REUSE.toml's `**` aggregate annotation already makes every file compliant, so
# headers are an opt-in per-file convention (used on source files), not a blanket
# operation. Pass `--copyright` WITHOUT a year — comply prepends the current year
# itself, so embedding one would double it ("2026 2026 …"). --merge-copyrights
# keeps re-runs idempotent (no duplicate copyright lines).
# `<paths>` is declared required in the usage spec below, so mise rejects an
# empty invocation with a proper CLI error before this script ever runs.
eval "paths=(${usage_paths:-})"
# Never annotate symlinks — the per-crate LICENSE-APACHE/LICENSE-MIT links point
# at the shared LICENSES/ texts, so `comply annotate` would write THROUGH the link
# (corrupting the canonical license) or drop a `.license` sidecar. Filter them out
# (defence-in-depth; the *.rs scope already excludes the license links).
real=()
for p in "${paths[@]}"; do
    if [ -L "$p" ]; then
        echo "comply:fix: skipping symlink $p" >&2
    else
        real+=("$p")
    fi
done
# Joined-string test, not `${#real[@]}`: mise renders run blocks as tera
# templates and bash's array-length syntax opens a tera comment (`{#`), failing
# the task with "Closing comment tag `#}` not found". Paths are never empty
# strings, so the two tests agree here.
if [ -z "${real[*]:-}" ]; then
    exit 0
fi
# `comply-cli` is NOT a package in this workspace -- the members are ignorefile,
# -cli, -lsp, -mcp and -wasm -- so `cargo run -p comply-cli` failed outright with
# "package(s) `comply-cli` not found in workspace". This calls the installed
# binary, matching [tasks.comply], which provisions it on demand.
# --update-reuse-toml false is now the CLI default too; it stays spelled out
# here so this task's behaviour is pinned regardless of any future default
# change. The `**` aggregate in REUSE.toml already covers these files, so a
# per-file `override` block adds nothing -- and `override` would supersede the
# inline header written above.
# `annotate`, not `fix`: `comply fix [PATH]` takes ONE project DIRECTORY and
# auto-fixes project-level compliance, so handing it a file list dies with
# "unexpected argument 'crates/.../convert.rs' found". `annotate [FILES]...` is
# the per-file header writer this task wants.
comply annotate "${real[@]}"
# `annotate` writes header CONTENT but leaves the shape of a header that already
# exists; only `format` canonicalises shape. Running both is what makes this task
# agree with `comply:format:check` by construction -- annotate for files with no
# header, format for the ones that have a non-canonical one.
#
# An earlier awk pass here did the opposite: it deleted the bare comment marker
# between the copyright and licence lines. Because hk runs this task as a
# pre-commit FIX step on every staged *.rs, each commit silently reverted the
# canonical form, and `comply:format:check` then failed in CI on files that had
# just been "fixed".
# `--files` takes ONE value per occurrence, so the flag is repeated rather than
# handed a list; `--files a.rs b.rs` makes clap reject b.rs as a stray argument.
fmt_args=()
for p in "${real[@]}"; do
    fmt_args+=(--files "$p")
done
comply format "${fmt_args[@]}"
'''
shell = "bash -c"
usage = 'arg "<paths>" var=#true help="files to annotate, e.g. crates/foo/src/lib.rs"'

[tasks."comply:fix:all"]
alias = []
description = "Whole-project SPDX header pass: run comply:fix over EVERY tracked Rust source file. Idempotent (existing 2-line headers are left byte-identical), so it's safe to run anytime"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

files=()
while IFS= read -r f; do files+=("$f"); done < <(git ls-files '*.rs')
if [ -z "${files[*]:-}" ]; then
    echo "comply:fix:all: no tracked .rs files found." >&2
    exit 0
fi
mise run comply:fix "${files[@]}"
'''
shell = "bash -c"

