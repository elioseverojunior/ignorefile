[tasks."coverage:sarif"]
alias = ["cov:sarif", "sarif"]
depends = ["coverage:llvm"]
depends_post = []
description = "Convert the lcov.info produced by `llvm-cov` into SARIF for code-scanning upload. Description was a stale copy of the tarpaulin task's and described the wrong tool entirely"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Same source of truth the llvm-cov task reads. Without it cargo-crap compares
# every source file against the LCOV report and warns about the ones coverage
# deliberately omits -- "2 source files had no matching entry" for main.rs and
# build.rs, which is a configuration echo, not a finding.
# Not `${#EXCLUDES[@]}`: `{#` opens a Tera comment in a mise run block.
EXCLUDES=()
while IFS= read -r glob; do
  [ -n "$glob" ] && EXCLUDES+=(--exclude "$glob")
done < <(RUST_LOG=error taplo get -f tarpaulin.toml 'default.exclude-files')

if [ -z "${EXCLUDES[*]:-}" ]; then
  echo "Could not read exclude-files from tarpaulin.toml" >&2
  exit 1
fi

cargo crap --lcov lcov.info --format sarif "${EXCLUDES[@]}" > results.sarif
'''
shell = "bash -c"

[tasks."coverage:llvm"]
alias = ["lcov"]
depends = []
depends_post = []
description = "Measure workspace coverage with cargo-llvm-cov + nextest, output lcov.info. INFORMATIONAL: tarpaulin is the gate of record (see tarpaulin.toml); llvm-cov's region/function metrics cannot reach 100 on this tree because the shortfall is `?` error edges no test can execute, so ci.yml does not gate on it"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Derived from `exclude-files` in tarpaulin.toml -- the single source of truth
# for what coverage ignores. It used to be a hand-copied regex, so the two
# engines could drift apart and the verdict would depend on which one ran.
# Globs become anchored regexes: `.` escapes, `*` becomes one path segment.
IGNORE=$(
  RUST_LOG=error taplo get -f tarpaulin.toml 'default.exclude-files' \
    | sed -e 's/\./\\./g' -e 's#\*#[^/]+#g' -e 's/$/$/' \
    | paste -sd '|' -
)
if [ -z "$IGNORE" ]; then
  echo "Could not read exclude-files from tarpaulin.toml" >&2
  exit 1
fi

# 1. Collect coverage data using nextest.
cargo llvm-cov nextest --workspace

# 2. Generate lcov report with threshold gating.
cargo llvm-cov report \
  --lcov --output-path lcov.info \
  --ignore-filename-regex "${IGNORE}" \
  --fail-under-lines "${usage_threshold?}" \
  --fail-under-functions "${usage_threshold?}" \
  --fail-under-regions "${usage_threshold?}"
'''
shell = "bash -c"
usage = '''
flag "-t --threshold <threshold>" help="Coverage threshold" default="100" env="RUST_COVERAGE_THRESHOLD"
'''

[tasks."docker:test"]
alias = ["coverage:linux", "covlinux", "dkrt", "dkr:test"]
depends = []
depends_post = []
description = "Run the coverage gate inside a Linux container, via Dockerfile.Test. tarpaulin attributes closure and const-fn bodies differently per platform, so a macOS workstation reported 100% on a tree CI measured at 99.63% -- this is how a non-Linux machine sees the number the gate actually uses. The toolchain, nightly and cargo-tarpaulin are baked into the image, so only the first run pays for them"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

IMAGE="ignorefile-test:local"

# Build is a no-op once the layers are cached. Dockerfile.Test copies only
# `rust-toolchain.toml`, so this rebuilds when the pin moves or the file changes
# and is skipped otherwise -- which is the entire reason the task no longer
# installs nightly and compiles tarpaulin on every invocation.
docker build --file Dockerfile.Test --target test --tag "${IMAGE}" .

# The source is bind-mounted rather than copied, so an edit needs no rebuild.
# `target-linux` is a named volume: the host's `target/` holds macOS artifacts
# that Linux would rebuild from scratch anyway, and writing Linux artifacts back
# over them would force the host to rebuild in turn. Keeping the two apart is
# what makes repeat runs incremental on both sides.
# Variadic args arrive as a shell-escaped string, not in "$@"; eval into an
# array so `mise run docker:test -- bash -lc '...'` survives intact. Empty by
# default, which lets the image's ENTRYPOINT run the gate.
eval "args=(${usage_args:-})"

# As the host user, never root. Two reasons, both learned the hard way:
# `cli.rs`'s `add_reports_an_unwritable_config` chmods a file to 0o444 and
# asserts the write fails -- root ignores permission bits, so that test failed
# in the container while passing on the host and in CI. And anything root writes
# into the bind mount (cobertura.xml, lcov.info) comes back root-owned in the
# working tree. HOME is redirected because the host uid has no passwd entry
# inside the image.
docker run --rm -t \
  --user "$(id -u):$(id -g)" \
  --volume "$PWD":/work \
  --volume ignorefile-linux-target:/work/target-linux \
  --workdir /work \
  --env HOME=/tmp \
  --env RUST_COVERAGE_THRESHOLD="${usage_threshold?}" \
  "${IMAGE}" "${args[@]}"
'''
shell = "bash -c"
usage = '''
flag "-t --threshold <threshold>" help="Coverage threshold" default="100" env="RUST_COVERAGE_THRESHOLD"
arg "[args]" var=#true help="command to run instead of the gate, e.g. `bash` for a shell in the image"
'''

