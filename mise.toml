#!/usr/bin/env bash

set -Eeuo pipefail

repo=$(gh repo view --json nameWithOwner --jq '.nameWithOwner')

ids=$(gh run list --repo "${repo}" --limit 100 --json databaseId,status \
  --jq '.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting") | .databaseId')

if [[ -z "${ids}" ]]; then
