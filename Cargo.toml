[workspace]
exclude = []
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["Elio Severo Junior <elioseverojunior@gmail.com>"]
categories = ["command-line-utilities", "config", "development-tools"]
description = "Manage ignore files as structured, reviewable configuration"
documentation = "https://docs.rs/ignorefile"
edition = "2024"
keywords = ["cli", "config", "git", "gitignore", "vcs"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/elioseverojunior/ignorefile"
rust-version = "1.95"
version = "0.1.0"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = "deny"
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
warnings = "deny"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
collapsible_if = "allow"
expect_used = "warn"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"
unwrap_used = "warn"

[workspace.dependencies]
anyhow = { version = "1" }
chrono = { version = ">=0.4,<1.0.0", default-features = false, features = [
  "now",
  "std",
] }
clap = { version = "4", features = ["derive"] }
proptest = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# The maintained fork of serde_yaml, which is deprecated and unmaintained (and so
# would be reported by `mise run audit`).
serde_norway = { version = "0.9" }
tempfile = { version = "3" }
thiserror = { version = "2" }
# The `+spec-1.1.0` build metadata belongs to the released version, not to the
# requirement: cargo ignores it here and warns on every build.
toml = { version = "1" }
wasm-bindgen = { version = "0.2" }
